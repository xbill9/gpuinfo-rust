[package]
name = "gpuinfo-rust"
version = "0.3.0"
edition = "2024"
description = "Detailed GPU information MCP server in Rust"
license = "MIT"
repository = "https://github.com/xbill9/gpuinfo-rust"

[dependencies]
anyhow = "^1.0.98"
rmcp = { version = "0.14.0", features = ["auth", "server","macros", "transport-io"] }
serde = { version = "^1.0.219", features = ["derive"] }
serde_json = "^1.0.140"
schemars = "1"
tokio = { version = "^1.46.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "^0.1.41"
tracing-subscriber = { version = "^0.3.19", features = ["env-filter", "json"] }
nvml-wrapper = "0.13"
pci-ids = "0.2.6"

[profile.release]
opt-level = 3
lto = true
strip = true  # Automatically strip symbols from the binary.
codegen-units = 1
panic = "abort"
